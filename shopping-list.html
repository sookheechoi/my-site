<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<style>
  :root {
    --bg: #fdf8f3;
    --ink: #4a4152;
    --muted: #9a91a3;
    --line: #ece4ee;
    --white: #ffffff;
    --accent: #f59fb4;
    --accent-dark: #e57f99;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 17px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px; }

  header { text-align: center; margin-bottom: 22px; }
  h1 { margin: 0; font-size: 32px; letter-spacing: -0.5px; }
  .progress { margin-top: 8px; color: var(--muted); font-size: 15px; }

  /* 새 항목 추가 */
  .add {
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--white);
    border-radius: 24px;
    padding: 12px;
    box-shadow: 0 4px 16px rgba(160, 130, 170, 0.15);
    margin-bottom: 24px;
  }
  .add input, .add select {
    font: inherit; color: var(--ink);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
    background: var(--white);
    outline: none;
  }
  .add input { flex: 1 1 200px; min-width: 0; }
  .add select { flex: 0 1 190px; }
  .add input:focus, .add select:focus { border-color: var(--accent); }
  .btn {
    font: inherit; font-weight: 700;
    border: none; border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
    background: var(--accent); color: var(--white);
  }
  .btn:hover { background: var(--accent-dark); }

  /* 종류별 카드 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--c);
    border-radius: 28px;
    padding: 18px 16px 14px;
    box-shadow: 0 4px 14px rgba(160, 130, 170, 0.14);
  }
  .card h2 {
    margin: 0 4px 12px;
    font-size: 20px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .card h2 .count { font-size: 14px; font-weight: 500; color: var(--ink); opacity: 0.6; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 999px;
    padding: 8px 8px 8px 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  li:hover { background: var(--white); }
  .check {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2.5px solid var(--d);
    background: var(--white);
    display: grid; place-items: center;
    color: var(--white); font-size: 15px; font-weight: 700;
  }
  .name { flex: 1; word-break: break-all; }
  li.done { opacity: 0.5; }
  li.done .check { background: var(--d); }
  li.done .name { text-decoration: line-through; text-decoration-thickness: 2px; }
  .del {
    flex: none;
    border: none; background: transparent;
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 18px; color: var(--muted);
    cursor: pointer;
  }
  .del:hover { background: rgba(0, 0, 0, 0.06); color: var(--ink); }
  .empty { color: var(--ink); opacity: 0.5; font-size: 15px; padding: 4px 8px 8px; }

  footer { text-align: center; margin-top: 30px; }
  .btn.soft { background: var(--white); color: var(--accent-dark); border: 2px solid var(--accent); }
  .btn.soft:hover { background: #fff0f4; }

  @media (max-width: 480px) {
    h1 { font-size: 26px; }
    .add select, .add .btn { flex: 1 1 auto; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 우리 집 장보기</h1>
    <div class="progress" id="progress"></div>
  </header>

  <form class="add" id="addForm">
    <input id="newName" type="text" placeholder="살 것을 적어 주세요 (예: 바나나)" autocomplete="off">
    <select id="newCat"></select>
    <button class="btn" type="submit">추가</button>
  </form>

  <main class="grid" id="grid"></main>

  <footer>
    <button class="btn soft" id="resetBtn" type="button">🔄 체크 모두 풀기</button>
  </footer>
</div>

<script>
  const STORAGE_KEY = "our-home-shopping-list";

  // 종류: 카드 색(c)과 체크 색(d)
  const CATEGORIES = [
    { id: "veg",   name: "🥬 채소·과일",     c: "#dff3d8", d: "#8ccf7e" },
    { id: "meat",  name: "🥩 고기·생선",     c: "#fde0e4", d: "#f2a0ad" },
    { id: "dairy", name: "🥛 유제품·달걀",   c: "#dcecfb", d: "#8fbde8" },
    { id: "grain", name: "🍚 곡물·가공식품", c: "#fdf3cf", d: "#ecc95c" },
    { id: "sauce", name: "🧂 양념·소스",     c: "#fde6d2", d: "#f0ad78" },
    { id: "home",  name: "🧻 생활용품",      c: "#ebe2f8", d: "#b39ae0" },
  ];

  const DEFAULT_ITEMS = [
    ["veg", "대파"], ["veg", "양파"], ["veg", "감자"], ["veg", "사과"],
    ["meat", "돼지고기"], ["meat", "닭고기"], ["meat", "고등어"],
    ["dairy", "우유"], ["dairy", "계란"], ["dairy", "요거트"],
    ["grain", "쌀"], ["grain", "두부"], ["grain", "라면"],
    ["sauce", "간장"], ["sauce", "식용유"],
    ["home", "휴지"], ["home", "주방세제"], ["home", "쓰레기봉투"],
  ];

  let nextId = 1;
  const makeItem = (cat, name) => ({ id: nextId++, cat, name, done: false, doneAt: 0 });

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && Array.isArray(saved.items)) {
        nextId = saved.nextId || saved.items.reduce((m, it) => Math.max(m, it.id), 0) + 1;
        return saved.items;
      }
    } catch (e) { /* 저장된 게 없거나 읽을 수 없으면 기본 목록 사용 */ }
    return DEFAULT_ITEMS.map(([cat, name]) => makeItem(cat, name));
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ nextId, items }));
    } catch (e) { /* 저장이 막힌 브라우저에서는 그냥 넘어감 */ }
  }

  let items = load();

  const grid = document.getElementById("grid");
  const progress = document.getElementById("progress");
  const newName = document.getElementById("newName");
  const newCat = document.getElementById("newCat");

  CATEGORIES.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat.id;
    opt.textContent = cat.name;
    newCat.appendChild(opt);
  });

  function render() {
    grid.innerHTML = "";
    CATEGORIES.forEach(cat => {
      // 안 산 것은 추가한 순서대로, 산 것은 체크한 순서대로 아래에
      const list = items
        .filter(it => it.cat === cat.id)
        .sort((a, b) => (a.done - b.done) || (a.done ? a.doneAt - b.doneAt : a.id - b.id));
      const left = list.filter(it => !it.done).length;

      const card = document.createElement("section");
      card.className = "card";
      card.style.setProperty("--c", cat.c);
      card.style.setProperty("--d", cat.d);

      const h2 = document.createElement("h2");
      h2.innerHTML = `<span></span><span class="count"></span>`;
      h2.children[0].textContent = cat.name;
      h2.children[1].textContent = list.length ? `${left}개 남음` : "";
      card.appendChild(h2);

      const ul = document.createElement("ul");
      if (!list.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "아직 항목이 없어요";
        card.appendChild(empty);
      }
      list.forEach(it => {
        const li = document.createElement("li");
        if (it.done) li.classList.add("done");
        li.setAttribute("role", "checkbox");
        li.setAttribute("aria-checked", it.done);
        li.tabIndex = 0;

        const check = document.createElement("span");
        check.className = "check";
        check.textContent = it.done ? "✓" : "";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = it.name;

        const del = document.createElement("button");
        del.className = "del";
        del.type = "button";
        del.textContent = "×";
        del.title = "지우기";
        del.setAttribute("aria-label", `${it.name} 지우기`);
        del.addEventListener("click", e => {
          e.stopPropagation();
          items = items.filter(x => x.id !== it.id);
          save(); render();
        });

        const toggle = () => {
          it.done = !it.done;
          it.doneAt = it.done ? Date.now() : 0;
          save(); render();
        };
        li.addEventListener("click", toggle);
        li.addEventListener("keydown", e => {
          if (e.target === li && (e.key === " " || e.key === "Enter")) { e.preventDefault(); toggle(); }
        });

        li.append(check, name, del);
        ul.appendChild(li);
      });
      card.appendChild(ul);
      grid.appendChild(card);
    });

    const bought = items.filter(it => it.done).length;
    progress.textContent = items.length
      ? `${items.length}개 중 ${bought}개 샀어요`
      : "목록이 비어 있어요. 위에서 살 것을 추가해 보세요!";
  }

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = newName.value.trim();
    if (!name) { newName.focus(); return; }
    items.push(makeItem(newCat.value, name));
    newName.value = "";
    newName.focus();
    save(); render();
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!items.some(it => it.done)) return;
    if (!confirm("체크한 것을 모두 풀까요?")) return;
    items.forEach(it => { it.done = false; it.doneAt = 0; });
    save(); render();
  });

  render();
</script>
</body>
</html>
